kind = "web"
previewPath = "/"
title = "Sun Dessert Store"
description = "A warm dessert storefront for Sun Dessert in Elmenoufia, with category browsing, product detail pages, WhatsApp ordering, and a simple admin panel for managing products."
version = "1.0.0"
id = "artifacts/sun-dessert-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21792

[services.development]
run = "pnpm --filter @workspace/sun-dessert-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sun-dessert-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/sun-dessert-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21792"
BASE_PATH = "/"
